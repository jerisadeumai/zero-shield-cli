[tool:pytest]
# Pytest configuration for Zero-Shield CLI test suite
# Ensures unified discovery of all 131 test functions

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output configuration
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Markers for test categorization
markers =
    security: Security-related tests (credential redaction, sanitization, encryption)
    property: Property-based tests using hypothesis
    integration: Integration and cross-function tests
    performance: Performance and scalability tests
    unit: Unit tests for individual functions
    skipif: Skip tests conditionally based on platform/environment

# Minimum version
minversion = 6.0

# Test timeout (optional)
timeout = 300

# Coverage settings (if pytest-cov is installed)
# addopts = --cov=zero_shield_cli --cov-report=html --cov-report=term-missing

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:hypothesis.*